<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cosmic Farmer - Final Working</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        font-family: Arial, sans-serif;
        touch-action: none;
    }
    
    canvas {
        display: block;
        background: #000;
    }
    
    #msg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        z-index: 100;
        pointer-events: none;
    }
    
    #hud {
        position: absolute;
        bottom: 10px;
        left: 10px;
        color: #fff;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
    }
    
    #inv {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
    }
    
    .slot {
        width: 36px;
        height: 36px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        text-align: center;
        font-size: 24px;
        cursor: pointer;
        position: relative;
        user-select: none;
    }
    
    .slot .amt {
        position: absolute;
        bottom: 2px;
        right: 2px;
        font-size: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 1px 3px;
        border-radius: 3px;
        color: #fff;
    }
    
    .slot.selected {
        border: 2px solid #ff0 !important;
        background: rgba(255, 255, 0, 0.3) !important;
        box-shadow: 0 0 10px #ff0;
    }
    
    #menu {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 1000;
    }
    
    .btn {
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid #555;
        color: #fff;
        padding: 12px 24px;
        margin: 8px;
        cursor: pointer;
        border-radius: 5px;
        font-size: 16px;
    }
    
    .btn:hover {
        background: rgba(255, 255, 255, 0.3);
    }
    
    #debug {
        position: absolute;
        bottom: 50px;
        left: 10px;
        color: #0f0;
        background: rgba(0, 0, 0, 0.7);
        padding: 8px;
        border-radius: 5px;
        font-size: 12px;
        font-family: monospace;
        max-width: 300px;
        display: none;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<div id="hud">: <span id="tool">Brak</span></div>
<div id="inv"></div>
<div id="debug"></div>
<div id="menu" style="display: none;">
    <h2>Cosmic Farmer</h2>
    <button class="btn" onclick="resume()">Wzn2w</button>
    <button class="btn" onclick="newGame()">Nowa gra</button>
    <button class="btn" onclick="toggleDebug()">Debug</button>
    <button class="btn" onclick="help()">Pomoc</button>
</div>

<script>
// ==================== KONFIGURACJA ====================
var CFG = {
    RES: {
        drewo: {n: "Drewno", i: "", m: 99, t: 1000},
        kamien: {n: "Kamie", i: "", m: 99, t: 1500},
        zboze: {n: "Zboe", i: "", m: 99, t: 800},
        metal: {n: "Metal", i: "", m: 99, t: 2000}
    },
    TOOLS: [
        {id: "motyka", n: "Motyka", e: 1.0, i: ""},
        {id: "siekiera", n: "Siekiera", e: 2.0, i: ""},
        {id: "kilof", n: "Kilof", e: 3.0, i: ""}
    ],
    PLAYER: {SPEED: 5}
};

// ==================== ZMIENNE GLOBALNE ====================
var c, ctx;
var GS = {};
var PL = {};
var IN = {};
var CAM = {};
var PR = [];
var SEL_INV = 0;
var COLLECT = null;
var COLLECT_T = 0;
var PAUSED = false;
var GLOOP = null;
var DEBUG_MODE = false;

// ==================== INICJALIZACJA ====================
function init() {
    c = document.getElementById('c');
    if (!c) {
        showMsg("Brak canvas!");
        return;
    }
    
    ctx = c.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    initInput();
    initUI();
    newGame();
    
    GLOOP = requestAnimationFrame(gameLoop);
}

function resize() {
    if (!c) return;
    c.width = window.innerWidth;
    c.height = window.innerHeight;
}

function initInput() {
    IN = {
        keys: {},
        touch: {x: 0, y: 0, active: false},
        lastTouch: {x: 0, y: 0}
    };
    
    document.addEventListener('keydown', function(e) {
        IN.keys[e.code] = true;
        
        if (e.code === 'Escape') {
            e.preventDefault();
            toggleMenu();
        }
        if (e.code === 'Space') {
            e.preventDefault();
            attemptCollect();
        }
        
        // NAPRAWIONE: Klawisze 1-0 mapuja sie na sloty 0-9
        if (e.code.startsWith('Digit')) {
            var digit = parseInt(e.code.replace('Digit', ''));
            // 1 -> slot 0, 2 -> slot 1, ..., 0 -> slot 9
            var idx = digit === 0 ? 9 : digit - 1;
            if (idx >= 0 && idx < 10) {
                e.preventDefault();
                selInv(idx);
            }
        }
        
        if (DEBUG_MODE && e.code === 'KeyD') {
            debugLog("=== DEBUG INFO ===");
            debugLog("PL: x=" + PL.x.toFixed(1) + ", y=" + PL.y.toFixed(1) + ", tool=" + PL.currentTool);
            debugLog("SEL_INV: " + SEL_INV);
            debugLog("GS.inv: " + JSON.stringify(GS.inv));
            debugLog("PR count: " + PR.length);
        }
    });
    
    document.addEventListener('keyup', function(e) {
        IN.keys[e.code] = false;
    });
    
    c.addEventListener('touchstart', function(e) {
        e.preventDefault();
        var rect = c.getBoundingClientRect();
        var t = e.touches[0];
        IN.touch.x = t.clientX - rect.left;
        IN.touch.y = t.clientY - rect.top;
        IN.touch.active = true;
        IN.lastTouch.x = IN.touch.x;
        IN.lastTouch.y = IN.touch.y;
    });
    
    c.addEventListener('touchend', function(e) {
        e.preventDefault();
        IN.touch.active = false;
    });
    
    c.addEventListener('touchmove', function(e) {
        e.preventDefault();
        var rect = c.getBoundingClientRect();
        var t = e.touches[0];
        IN.touch.x = t.clientX - rect.left;
        IN.touch.y = t.clientY - rect.top;
    });
    
    // Klikniecie na canvas - zbieranie
    c.addEventListener('click', function(e) {
        e.preventDefault();
        attemptCollect();
    });
}

function initUI() {
    var inv = document.getElementById('inv');
    if (inv) {
        inv.innerHTML = '';
        for (var i = 0; i < 10; i++) {
            var slot = document.createElement('div');
            slot.className = 'slot';
            slot.id = 'slot-' + i;
            slot.innerHTML = '<span class="amt" id="amt-' + i + '"></span>';
            slot.onclick = (function(idx) { 
                return function() { selInv(idx); }; 
            })(i);
            inv.appendChild(slot);
        }
    }
}

function toggleDebug() {
    DEBUG_MODE = !DEBUG_MODE;
    var debug = document.getElementById('debug');
    if (debug) {
        debug.style.display = DEBUG_MODE ? 'block' : 'none';
    }
    debugLog("Debug mode: " + (DEBUG_MODE ? "ON" : "OFF"));
}

function debugLog(msg) {
    var debug = document.getElementById('debug');
    if (debug && DEBUG_MODE) {
        var p = document.createElement('div');
        p.textContent = msg;
        debug.insertBefore(p, debug.firstChild);
        
        // Keep only last 10 messages
        while (debug.children.length > 10) {
            debug.removeChild(debug.lastChild);
        }
    }
    console.log(msg);
}

// ==================== NOWA GRA ====================
function newGame() {
    debugLog("=== NEW GAME ===");
    
    // Inicjalizuj stan gry
    GS = {
        inv: []
    };
    
    // Inicjalizuj 10 pustych slotow
    for (var i = 0; i < 10; i++) {
        GS.inv[i] = null;
    }
    
    debugLog("Initial GS.inv: " + JSON.stringify(GS.inv));
    
    // Dodaj narzedzia na start
    GS.inv[0] = {id: "motyka", type: "tool", amount: 1};
    GS.inv[1] = {id: "siekiera", type: "tool", amount: 1};
    GS.inv[2] = {id: "kilof", type: "tool", amount: 1};
    
    debugLog("After adding tools: " + JSON.stringify(GS.inv));
    
    // Inicjalizuj gracza
    PL = {
        x: 0,
        y: 0,
        currentTool: "motyka",
        speed: CFG.PLAYER.SPEED,
        angle: 0
    };
    
    // Inicjalizuj kamere
    CAM = {
        x: 0,
        y: 0,
        zoom: 1
    };
    
    // Inicjalizuj zasoby
    PR = [];
    SEL_INV = 0;
    COLLECT = null;
    COLLECT_T = 0;
    PAUSED = false;
    
    // Generuj zasoby wokol punktu (0,0)
    for (var i = 0; i < 20; i++) {
        var angle = Math.random() * Math.PI * 2;
        var distance = 80 + Math.random() * 250;
        var resTypes = Object.keys(CFG.RES);
        PR.push({
            x: Math.cos(angle) * distance,
            y: Math.sin(angle) * distance,
            type: resTypes[Math.floor(Math.random() * resTypes.length)]
        });
    }
    
    debugLog("Generated " + PR.length + " resources");
    
    updateHUD();
    updateInv();
    
    showMsg("WASD - poruszanie, Spacja/Klik - zbieranie, 1-0 - narzedzie");
}

// ==================== RENDEROWANIE ====================
function render() {
    if (!c || !ctx) return;
    
    // Czyszczenie - zielone tlo
    ctx.fillStyle = '#1a3c1a';
    ctx.fillRect(0, 0, c.width, c.height);
    
    // Ustaw kamery na pozycje gracza
    CAM.x = PL.x;
    CAM.y = PL.y;
    
    // Rysuj wzgledem kamery
    ctx.save();
    ctx.translate(c.width / 2, c.height / 2);
    ctx.scale(CAM.zoom, CAM.zoom);
    ctx.translate(-CAM.x, -CAM.y);
    
    // Rysuj zasoby
    drawResources();
    
    // Rysuj gracza
    drawPlayer();
    
    // Rysuj zbieranie
    if (COLLECT) {
        drawCollecting();
    }
    
    // Rysuj wskaznik kierunku zebrania
    drawCollectionIndicator();
    
    ctx.restore();
}

function drawResources() {
    PR.forEach(function(r) {
        var screenX = r.x - CAM.x + c.width / 2;
        var screenY = r.y - CAM.y + c.height / 2;
        
        // Odleglosc od gracza
        var dx = r.x - PL.x;
        var dy = r.y - PL.y;
        var distance = Math.sqrt(dx*dx + dy*dy);
        
        if (distance > 500) return;
        
        var size = Math.max(16, 32 - distance/30);
        var res = CFG.RES[r.type];
        if (res) {
            ctx.font = size + 'px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Tlo dla zasobu
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.beginPath();
            ctx.arc(screenX, screenY, size/2 + 4, 0, Math.PI * 2);
            ctx.fill();
            
            // Ikona zasobu
            ctx.fillStyle = '#fff';
            ctx.fillText(res.i, screenX, screenY);
            
            // Ramka jeśli można zebrać
            if (distance <= 50) {
                ctx.strokeStyle = '#0f0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(screenX, screenY, size/2 + 8, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
    });
}

function drawPlayer() {
    ctx.save();
    ctx.translate(PL.x, PL.y);
    
    // Obracanie postaci
    var targetAngle = PL.angle;
    
    if (IN.keys['KeyW'] || IN.keys['ArrowUp']) {
        targetAngle = Math.PI * 1.5; // Góra
    }
    if (IN.keys['KeyS'] || IN.keys['ArrowDown']) {
        targetAngle = Math.PI * 0.5; // Dół
    }
    if (IN.keys['KeyA'] || IN.keys['ArrowLeft']) {
        targetAngle = Math.PI; // Lewo
    }
    if (IN.keys['KeyD'] || IN.keys['ArrowRight']) {
        targetAngle = 0; // Prawo
    }
    
    // Plynne obracanie
    var diff = targetAngle - PL.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    PL.angle += diff * 0.15;
    
    // Dotyk - obracanie
    if (IN.touch.active) {
        var centerX = c.width / 2;
        var centerY = c.height / 2;
        PL.angle = Math.atan2(IN.touch.y - centerY, IN.touch.x - centerX);
    }
    
    ctx.rotate(PL.angle);
    
    // Cialo gracza
    ctx.fillStyle = '#1a5c80';
    ctx.beginPath();
    ctx.arc(0, -5, 8, 0, Math.PI * 2);
    ctx.fill();
    
    // Glowa
    ctx.fillStyle = '#f5d5a0';
    ctx.beginPath();
    ctx.arc(0, -15, 5, 0, Math.PI * 2);
    ctx.fill();
    
    // Nogi
    ctx.fillStyle = '#3a3a80';
    ctx.fillRect(-3, 5, 6, 10);
    
    // Rece
    ctx.fillRect(-10, -5, 8, 3);
    ctx.fillRect(2, -5, 8, 3);
    
    // Narzedzie w reku
    var tool = CFG.TOOLS.find(function(t) { return t.id === PL.currentTool; });
    if (tool) {
        ctx.fillStyle = '#fff';
        ctx.font = '16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(tool.i, 15, -10);
    }
    
    // Wskaznik kierunku (dziob)
    ctx.strokeStyle = '#ff0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(20, 0);
    ctx.stroke();
    
    ctx.restore();
}

function drawCollecting() {
    if (!COLLECT) return;
    var res = CFG.RES[COLLECT.type];
    if (!res) return;
    
    var progress = COLLECT_T / (res.t / getToolEff());
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(-100, -20, 200, 40);
    
    ctx.fillStyle = '#fff';
    ctx.font = '16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Zbieranie: ' + res.n, 0, 0);
    
    ctx.fillStyle = '#0f0';
    ctx.fillRect(-90, 10, 180 * progress, 10);
    
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(-90, 10, 180, 10);
}

function drawCollectionIndicator() {
    // Pokaz gdzie mozna zebrac
    for (var i = 0; i < PR.length; i++) {
        var r = PR[i];
        var dx = r.x - PL.x;
        var dy = r.y - PL.y;
        var distance = Math.sqrt(dx*dx + dy*dy);
        
        if (distance <= 50) {
            var screenX = r.x - CAM.x + c.width / 2;
            var screenY = r.y - CAM.y + c.height / 2;
            
            ctx.strokeStyle = '#0f0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(screenX, screenY, 20, 0, Math.PI * 2);
            ctx.stroke();
            break; // Tylko jeden na raz
        }
    }
}

// ==================== LOGIKA ====================
function update(deltaTime) {
    if (PAUSED) return;
    
    handlePlayer(deltaTime);
    
    // Zbieranie
    if (COLLECT) {
        var res = CFG.RES[COLLECT.type];
        if (res) {
            COLLECT_T += deltaTime;
            if (COLLECT_T >= res.t / getToolEff()) {
                debugLog("Collecting completed: " + COLLECT.type);
                
                // Dodaj do inwentarza
                addInv(COLLECT.type, 1, 'resource');
                
                // Usun zebrany zasob
                var idx = PR.indexOf(COLLECT);
                if (idx > -1) {
                    PR.splice(idx, 1);
                }
                
                // Nowy zasob
                var angle = Math.random() * Math.PI * 2;
                var distance = 80 + Math.random() * 300;
                var resTypes = Object.keys(CFG.RES);
                PR.push({
                    x: PL.x + Math.cos(angle) * distance,
                    y: PL.y + Math.sin(angle) * distance,
                    type: resTypes[Math.floor(Math.random() * resTypes.length)]
                });
                
                COLLECT = null;
                COLLECT_T = 0;
                
                showMsg('Zebrano: ' + res.n);
                updateInv();
            }
        }
    }
    
    updateHUD();
}

function handlePlayer(deltaTime) {
    var moveSpeed = PL.speed * deltaTime * 0.016;
    
    // Ruch klawiatury
    if (IN.keys['KeyW'] || IN.keys['ArrowUp']) {
        PL.y -= moveSpeed;
    }
    if (IN.keys['KeyS'] || IN.keys['ArrowDown']) {
        PL.y += moveSpeed;
    }
    if (IN.keys['KeyA'] || IN.keys['ArrowLeft']) {
        PL.x -= moveSpeed;
    }
    if (IN.keys['KeyD'] || IN.keys['ArrowRight']) {
        PL.x += moveSpeed;
    }
    
    // Ruch dotyku
    if (IN.touch.active) {
        var centerX = c.width / 2;
        var centerY = c.height / 2;
        var dx = IN.touch.x - centerX;
        var dy = IN.touch.y - centerY;
        var distance = Math.sqrt(dx*dx + dy*dy);
        if (distance > 10) {
            PL.x += (dx / distance) * moveSpeed * 2;
            PL.y += (dy / distance) * moveSpeed * 2;
        }
    }
    
    // Ograniczenia
    PL.x = Math.max(-2000, Math.min(2000, PL.x));
    PL.y = Math.max(-2000, Math.min(2000, PL.y));
}

function attemptCollect() {
    if (COLLECT) return; // Już zbieramy
    
    for (var i = 0; i < PR.length; i++) {
        var r = PR[i];
        var dx = r.x - PL.x;
        var dy = r.y - PL.y;
        var distance = Math.sqrt(dx*dx + dy*dy);
        
        if (distance <= 50) {
            COLLECT = r;
            COLLECT_T = 0;
            debugLog("Starting to collect: " + r.type);
            return;
        }
    }
    
    debugLog("No resource to collect nearby");
}

function getToolEff() {
    if (!PL.currentTool) return 1.0;
    var tool = CFG.TOOLS.find(function(t) { 
        return t.id === PL.currentTool; 
    });
    return tool ? tool.e : 1.0;
}

// ==================== INWENTARZ ====================
function selInv(idx) {
    debugLog("selInv called with idx: " + idx);
    
    SEL_INV = idx;
    
    var item = GS.inv[idx];
    if (item) {
        debugLog("Item at slot " + idx + ": " + JSON.stringify(item));
        
        if (item.type === 'tool') {
            PL.currentTool = item.id;
            updateHUD();
            showMsg('Wybrano: ' + (CFG.TOOLS.find(function(t) { 
                return t.id === item.id; 
            }) || {n: item.id}).n);
        } else if (item.type === 'resource') {
            showMsg('Wybrano: ' + CFG.RES[item.id].n + ' x' + item.amount);
        }
    } else {
        debugLog("Slot " + idx + " is empty");
        showMsg('Pusty slot!');
    }
    
    updateInv();
}

function addInv(id, amt, type) {
    debugLog("addInv: " + id + " x" + amt + " type=" + type);
    
    // Szukaj istniejacego stacka
    var existing = null;
    for (var i = 0; i < GS.inv.length; i++) {
        if (GS.inv[i] && GS.inv[i].id === id && GS.inv[i].type === type) {
            existing = GS.inv[i];
            break;
        }
    }
    
    if (existing) {
        var res = CFG.RES[id];
        var maxStack = res ? res.m : 99;
        if (existing.amount + amt <= maxStack) {
            existing.amount += amt;
            debugLog("Updated stack at slot " + GS.inv.indexOf(existing) + ": " + id + " = " + existing.amount);
        } else {
            var remaining = amt - (maxStack - existing.amount);
            existing.amount = maxStack;
            debugLog("Stack full, adding remaining: " + remaining);
            addInv(id, remaining, type);
        }
    } else {
        // Szukaj pustego slotu
        var emptySlot = -1;
        for (var i = 0; i < GS.inv.length; i++) {
            if (GS.inv[i] === null) {
                emptySlot = i;
                break;
            }
        }
        
        if (emptySlot !== -1) {
            GS.inv[emptySlot] = {id: id, type: type, amount: amt};
            debugLog("Added to empty slot " + emptySlot + ": " + id + " x" + amt);
            showMsg('Dodano: ' + CFG.RES[id].n);
        } else {
            debugLog("Inventory full!");
            showMsg('Inwentarz pelny!');
        }
    }
    
    updateInv();
}

function updateInv() {
    debugLog("updateInv called, GS.inv.length: " + GS.inv.length);
    
    for (var i = 0; i < 10; i++) {
        var slot = document.getElementById('slot-' + i);
        var amtSpan = document.getElementById('amt-' + i);
        
        if (slot && amtSpan) {
            var item = GS.inv[i];
            debugLog("Slot " + i + ": " + (item ? JSON.stringify(item) : "null"));
            
            if (item) {
                if (item.type === 'resource') {
                    var res = CFG.RES[item.id];
                    slot.textContent = res ? res.i : '?';
                    slot.title = (res ? res.n : item.id) + ': ' + item.amount;
                    amtSpan.textContent = item.amount > 1 ? item.amount : '';
                } else if (item.type === 'tool') {
                    var tool = CFG.TOOLS.find(function(t) { return t.id === item.id; });
                    slot.textContent = tool ? tool.i : '';
                    slot.title = tool ? tool.n : item.id;
                    amtSpan.textContent = '';
                }
            } else {
                slot.textContent = '';
                slot.title = '';
                amtSpan.textContent = '';
            }
            
            // Zaznacz wybrany slot
            if (SEL_INV === i) {
                slot.classList.add('selected');
            } else {
                slot.classList.remove('selected');
            }
        }
    }
}

function updateHUD() {
    var tool = document.getElementById('tool');
    
    if (tool) {
        if (PL.currentTool) {
            var toolObj = CFG.TOOLS.find(function(t) { 
                return t.id === PL.currentTool; 
            });
            tool.textContent = toolObj ? toolObj.n : 'Brak';
        } else {
            tool.textContent = 'Brak';
        }
    }
}

// ==================== MENU ====================
function toggleMenu() {
    PAUSED = !PAUSED;
    var menu = document.getElementById('menu');
    if (menu) {
        menu.style.display = PAUSED ? 'flex' : 'none';
    }
}

function resume() {
    PAUSED = false;
    var menu = document.getElementById('menu');
    if (menu) {
        menu.style.display = 'none';
    }
}

function help() {
    showMsg('WASD - poruszanie, Spacja/Klik - zbieranie, 1-0 - narzedzie, ESC - menu, D - debug', 5000);
}

function showMsg(text, duration) {
    var msg = document.getElementById('msg');
    if (msg) {
        msg.textContent = text;
        msg.style.display = 'block';
        if (!duration) duration = 2000;
        setTimeout(function() {
            if (msg) msg.style.display = 'none';
        }, duration);
    }
}

// ==================== PETLA GRY ====================
var lastTime = 0;
function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    var deltaTime = timestamp - lastTime;
    lastTime = timestamp;
    
    update(deltaTime);
    render();
    
    GLOOP = requestAnimationFrame(gameLoop);
}

// ==================== ROZPOCZECIE ====================
window.onload = init;
window.onbeforeunload = function() {
    if (GLOOP) {
        cancelAnimationFrame(GLOOP);
    }
};
</script>
</body>
