<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cosmic Farmer - Final Working Version</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        font-family: Arial, sans-serif;
        touch-action: none;
    }
    
    canvas {
        display: block;
        background: #000;
    }
    
    #msg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        z-index: 100;
        pointer-events: none;
    }
    
    #hud {
        position: absolute;
        bottom: 10px;
        left: 10px;
        color: #fff;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
    }
    
    #inv {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
    }
    
    .slot {
        width: 32px;
        height: 32px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        text-align: center;
        font-size: 20px;
        cursor: pointer;
        position: relative;
    }
    
    .slot .amt {
        position: absolute;
        bottom: 2px;
        right: 2px;
        font-size: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 1px 3px;
        border-radius: 3px;
    }
    
    .slot.selected {
        border: 1px solid #ff0 !important;
        background: rgba(255, 255, 0, 0.3) !important;
    }
    
    #menu {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 1000;
    }
    
    .btn {
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid #555;
        color: #fff;
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
        border-radius: 5px;
        font-size: 14px;
    }
    
    .btn:hover {
        background: rgba(255, 255, 255, 0.3);
    }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<div id="hud">💰: <span id="money">100</span> | ⚡: <span id="energy">100</span> | 🔨: <span id="tool">Brak</span></div>
<div id="inv"></div>
<div id="menu" style="display: none;">
    <h2>Cosmic Farmer</h2>
    <button class="btn" onclick="resume()">Wznów</button>
    <button class="btn" onclick="newGame()">Nowa gra</button>
    <button class="btn" onclick="help()">Pomoc</button>
</div>

<script>
// ==================== KONFIGURACJA ====================
var CFG = {
    RES: {
        drewo: {n: "Drewno", i: "🌳", v: 10, m: 99, t: 1000},
        kamien: {n: "Kamień", i: "🪨", v: 5, m: 99, t: 1500},
        zboze: {n: "Zboże", i: "🌾", v: 20, m: 99, t: 800}
    },
    TOOLS: [
        {id: "motyka", n: "Motyka", c: 50, e: 1.0},
        {id: "siekiera", n: "Siekiera", c: 75, e: 1.5}
    ],
    PLAYER: {SPEED: 5, ENERGY: 100, REGEN: 0.2}
};

// ==================== ZMIENNE GLOBALNE ====================
var c, ctx;
var GS = {};      // Stan gry
var PL = {};      // Gracz
var IN = {};      // Wejście
var CAM = {};     // Kamera
var PR = [];      // Zasoby na planecie
var SEL_INV = null;
var COLLECT = null;
var COLLECT_T = 0;
var PAUSED = false;
var GLOOP = null;

// ==================== INICJALIZACJA ====================
function init() {
    c = document.getElementById('c');
    if (!c) {
        showMsg("Brak canvas!");
        return;
    }
    
    ctx = c.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    initInput();
    initUI();
    newGame();
    
    GLOOP = requestAnimationFrame(gameLoop);
}

function resize() {
    if (!c) return;
    c.width = window.innerWidth;
    c.height = window.innerHeight;
}

function initInput() {
    IN = {
        keys: {},
        touch: {x: 0, y: 0, active: false}
    };
    
    document.addEventListener('keydown', function(e) {
        IN.keys[e.code] = true;
        
        if (e.code === 'Escape') {
            toggleMenu();
        }
        if (e.code === 'Space') {
            attemptCollect();
        }
        if (e.code.startsWith('Digit')) {
            var idx = parseInt(e.code.replace('Digit', '')) - 1;
            if (idx >= 0 && idx < 20) {
                selInv(idx);
            }
        }
    });
    
    document.addEventListener('keyup', function(e) {
        IN.keys[e.code] = false;
    });
    
    c.addEventListener('touchstart', function(e) {
        e.preventDefault();
        var rect = c.getBoundingClientRect();
        var t = e.touches[0];
        IN.touch.x = t.clientX - rect.left;
        IN.touch.y = t.clientY - rect.top;
        IN.touch.active = true;
    });
    
    c.addEventListener('touchend', function(e) {
        e.preventDefault();
        IN.touch.active = false;
    });
    
    c.addEventListener('touchmove', function(e) {
        e.preventDefault();
        var rect = c.getBoundingClientRect();
        var t = e.touches[0];
        IN.touch.x = t.clientX - rect.left;
        IN.touch.y = t.clientY - rect.top;
    });
}

function initUI() {
    var inv = document.getElementById('inv');
    if (inv) {
        inv.innerHTML = '';
        for (var i = 0; i < 20; i++) {
            var slot = document.createElement('div');
            slot.className = 'slot';
            slot.id = 'slot-' + i;
            slot.innerHTML = '<span class="amt" id="amt-' + i + '"></span>';
            slot.onclick = (function(idx) { 
                return function() { selInv(idx); }; 
            })(i);
            inv.appendChild(slot);
        }
    }
}

// ==================== NOWA GRA ====================
function newGame() {
    GS = {
        money: 100,
        inv: []
    };
    
    PL = {
        x: 0,
        y: 0,
        energy: CFG.PLAYER.ENERGY,
        maxEnergy: CFG.PLAYER.ENERGY,
        currentTool: null,
        speed: CFG.PLAYER.SPEED,
        angle: 0
    };
    
    CAM = {
        x: 0,
        y: 0,
        zoom: 1
    };
    
    PR = [];
    SEL_INV = null;
    COLLECT = null;
    COLLECT_T = 0;
    PAUSED = false;
    
    // Generuj zasoby wokół punktu (0,0)
    for (var i = 0; i < 15; i++) {
        var angle = Math.random() * Math.PI * 2;
        var distance = 100 + Math.random() * 200;
        var resTypes = Object.keys(CFG.RES);
        PR.push({
            x: Math.cos(angle) * distance,
            y: Math.sin(angle) * distance,
            type: resTypes[Math.floor(Math.random() * resTypes.length)]
        });
    }
    
    // Inicjalizuj inwentarz (20 pustych slotów)
    for (var i = 0; i < 20; i++) {
        GS.inv[i] = null;
    }
    
    updateHUD();
    updateInv();
    
    showMsg("Witaj! WASD - poruszanie, Spacja - zbieranie, 1-9 - narzędzie");
}

// ==================== RENDEROWANIE ====================
function render() {
    if (!c || !ctx) return;
    
    // Czyszczenie - zielone tło
    ctx.fillStyle = '#2a5c2a';
    ctx.fillRect(0, 0, c.width, c.height);
    
    // Ustaw kamery na pozycję gracza (DOKŁADNIE)
    CAM.x = PL.x;
    CAM.y = PL.y;
    
    // Rysuj względem kamery
    ctx.save();
    ctx.translate(c.width / 2, c.height / 2);
    ctx.scale(CAM.zoom, CAM.zoom);
    ctx.translate(-CAM.x, -CAM.y);
    
    // Rysuj zasoby
    drawResources();
    
    // Rysuj gracza (zawsze w (0,0) względem kamery)
    drawPlayer();
    
    // Rysuj zbieranie
    if (COLLECT) {
        drawCollecting();
    }
    
    ctx.restore();
}

function drawResources() {
    PR.forEach(function(r) {
        var screenX = r.x - CAM.x;
        var screenY = r.y - CAM.y;
        
        // Odległość od gracza
        var dx = r.x - PL.x;
        var dy = r.y - PL.y;
        var distance = Math.sqrt(dx*dx + dy*dy);
        
        if (distance > 400) return;
        
        var size = Math.max(16, 32 - distance/20);
        var res = CFG.RES[r.type];
        if (res) {
            ctx.font = size + 'px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(res.i, screenX, screenY);
        }
    });
}

function drawPlayer() {
    // Gracz jest zawsze w (0,0) względem kamery
    ctx.save();
    ctx.translate(0, 0);
    
    // Obracanie postaci - PŁYNNIE
    // Oblicz kierunek ruchu
    var targetAngle = PL.angle;
    
    // Jeśli gracz się porusza klawiszami - ustaw płynnie
    if (IN.keys['KeyW'] || IN.keys['ArrowUp']) {
        targetAngle = Math.PI * 1.5; // Góra
    }
    if (IN.keys['KeyS'] || IN.keys['ArrowDown']) {
        targetAngle = Math.PI * 0.5; // Dół
    }
    if (IN.keys['KeyA'] || IN.keys['ArrowLeft']) {
        targetAngle = Math.PI; // Lewo
    }
    if (IN.keys['KeyD'] || IN.keys['ArrowRight']) {
        targetAngle = 0; // Prawo
    }
    
    // Płynne obracanie (interpolacja)
    var diff = targetAngle - PL.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    PL.angle += diff * 0.15; // 15% interpolacji na klatkę
    
    // Dotyk - obracanie w kierunku dotyku
    if (IN.touch.active) {
        var centerX = c.width / 2;
        var centerY = c.height / 2;
        PL.angle = Math.atan2(IN.touch.y - centerY, IN.touch.x - centerX);
    }
    
    ctx.rotate(PL.angle);
    
    // Ciało gracza
    ctx.fillStyle = '#1a5c80';
    ctx.beginPath();
    ctx.arc(0, -5, 8, 0, Math.PI * 2);
    ctx.fill();
    
    // Głowa
    ctx.fillStyle = '#f5d5a0';
    ctx.beginPath();
    ctx.arc(0, -15, 5, 0, Math.PI * 2);
    ctx.fill();
    
    // Nogi
    ctx.fillStyle = '#3a3a80';
    ctx.fillRect(-3, 5, 6, 10);
    
    // Ręce
    ctx.fillRect(-10, -5, 8, 3);
    ctx.fillRect(2, -5, 8, 3);
    
    // Narzędzie
    if (PL.currentTool) {
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🔨', 12, -10);
    }
    
    // Wskaźnik kierunku
    ctx.strokeStyle = '#ff0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(20, 0);
    ctx.stroke();
    
    ctx.restore();
}

function drawCollecting() {
    if (!COLLECT) return;
    var res = CFG.RES[COLLECT.type];
    if (!res) return;
    
    var progress = COLLECT_T / (res.t / getToolEff());
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(-100, -20, 200, 40);
    
    ctx.fillStyle = '#fff';
    ctx.font = '16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Zbieranie: ' + res.i + ' ' + res.n, 0, 0);
    
    ctx.fillStyle = '#0f0';
    ctx.fillRect(-90, 10, 180 * progress, 10);
    
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(-90, 10, 180, 10);
}

// ==================== LOGIKA ====================
function update(deltaTime) {
    if (PAUSED) return;
    
    handlePlayer(deltaTime);
    
    // Regeneracja energii
    if (PL.energy < PL.maxEnergy) {
        PL.energy = Math.min(
            PL.energy + CFG.PLAYER.REGEN * deltaTime * 0.016,
            PL.maxEnergy
        );
    }
    
    // Zbieranie
    if (COLLECT) {
        var res = CFG.RES[COLLECT.type];
        if (res) {
            COLLECT_T += deltaTime;
            if (COLLECT_T >= res.t / getToolEff()) {
                addInv(COLLECT.type, 1, 'resource');
                var idx = PR.indexOf(COLLECT);
                if (idx > -1) {
                    PR.splice(idx, 1);
                }
                
                // Nowy zasób
                var angle = Math.random() * Math.PI * 2;
                var distance = 100 + Math.random() * 300;
                var resTypes = Object.keys(CFG.RES);
                PR.push({
                    x: PL.x + Math.cos(angle) * distance,
                    y: PL.y + Math.sin(angle) * distance,
                    type: resTypes[Math.floor(Math.random() * resTypes.length)]
                });
                
                COLLECT = null;
                COLLECT_T = 0;
                showMsg('Zebrano: ' + res.i + ' ' + res.n);
            }
        }
    }
    
    updateHUD();
    updateInv();
}

function handlePlayer(deltaTime) {
    var moveSpeed = PL.speed * deltaTime * 0.016;
    
    // Ruch klawiatury
    if (IN.keys['KeyW'] || IN.keys['ArrowUp']) {
        PL.y -= moveSpeed;
    }
    if (IN.keys['KeyS'] || IN.keys['ArrowDown']) {
        PL.y += moveSpeed;
    }
    if (IN.keys['KeyA'] || IN.keys['ArrowLeft']) {
        PL.x -= moveSpeed;
    }
    if (IN.keys['KeyD'] || IN.keys['ArrowRight']) {
        PL.x += moveSpeed;
    }
    
    // Ruch dotyku
    if (IN.touch.active) {
        var centerX = c.width / 2;
        var centerY = c.height / 2;
        var dx = IN.touch.x - centerX;
        var dy = IN.touch.y - centerY;
        var distance = Math.sqrt(dx*dx + dy*dy);
        if (distance > 10) {
            PL.x += (dx / distance) * moveSpeed * 2;
            PL.y += (dy / distance) * moveSpeed * 2;
        }
    }
    
    // Ograniczenia
    PL.x = Math.max(-1000, Math.min(1000, PL.x));
    PL.y = Math.max(-1000, Math.min(1000, PL.y));
}

function attemptCollect() {
    for (var i = 0; i < PR.length; i++) {
        var r = PR[i];
        var dx = r.x - PL.x;
        var dy = r.y - PL.y;
        var distance = Math.sqrt(dx*dx + dy*dy);
        
        if (distance <= 40) {
            COLLECT = r;
            COLLECT_T = 0;
            return;
        }
    }
}

function getToolEff() {
    if (!PL.currentTool) return 1.0;
    var tool = CFG.TOOLS.find(function(t) { 
        return t.id === PL.currentTool; 
    });
    return tool ? tool.e : 1.0;
}

// ==================== INWENTARZ ====================
function selInv(idx) {
    SEL_INV = idx;
    
    var item = GS.inv[idx];
    if (item && item.type === 'tool') {
        PL.currentTool = item.id;
        updateHUD();
        showMsg('Wybrano: ' + CFG.TOOLS.find(function(t) { 
            return t.id === item.id; 
        }).n);
    }
    
    updateInv();
}

function addInv(id, amt, type) {
    // Szukaj istniejącego stacka
    var existing = GS.inv.find(function(item) { 
        return item && item.id === id && item.type === type; 
    });
    
    if (existing) {
        var res = CFG.RES[id];
        var maxStack = res ? res.m : 99;
        if (existing.amount + amt <= maxStack) {
            existing.amount += amt;
        } else {
            var remaining = amt - (maxStack - existing.amount);
            existing.amount = maxStack;
            addInv(id, remaining, type);
        }
    } else {
        // Szukaj pustego slotu
        var emptySlot = -1;
        for (var i = 0; i < GS.inv.length; i++) {
            if (GS.inv[i] === null) {
                emptySlot = i;
                break;
            }
        }
        
        if (emptySlot !== -1) {
            GS.inv[emptySlot] = {id: id, type: type, amount: amt};
        } else {
            showMsg('Inwentarz pełny!');
        }
    }
    
    updateInv();
}

function updateInv() {
    for (var i = 0; i < 20; i++) {
        var slot = document.getElementById('slot-' + i);
        var amtSpan = document.getElementById('amt-' + i);
        
        if (slot && amtSpan) {
            var item = GS.inv[i];
            
            if (item) {
                if (item.type === 'resource') {
                    var res = CFG.RES[item.id];
                    slot.textContent = res ? res.i : '?';
                    slot.title = res.n + ': ' + item.amount;
                    amtSpan.textContent = item.amount > 1 ? item.amount : '';
                } else if (item.type === 'tool') {
                    slot.textContent = '🔨';
                    slot.title = CFG.TOOLS.find(function(t) { 
                        return t.id === item.id; 
                    }).n;
                    amtSpan.textContent = '';
                }
            } else {
                slot.textContent = '';
                slot.title = '';
                amtSpan.textContent = '';
            }
            
            // Zaznacz wybrany slot
            if (SEL_INV === i) {
                slot.classList.add('selected');
            } else {
                slot.classList.remove('selected');
            }
        }
    }
}

function updateHUD() {
    var money = document.getElementById('money');
    var energy = document.getElementById('energy');
    var tool = document.getElementById('tool');
    
    if (money) money.textContent = GS.money;
    if (energy) energy.textContent = Math.round(PL.energy);
    if (tool) {
        if (PL.currentTool) {
            var toolObj = CFG.TOOLS.find(function(t) { 
                return t.id === PL.currentTool; 
            });
            tool.textContent = toolObj ? toolObj.n : 'Brak';
        } else {
            tool.textContent = 'Brak';
        }
    }
}

// ==================== MENU ====================
function toggleMenu() {
    PAUSED = !PAUSED;
    var menu = document.getElementById('menu');
    if (menu) {
        menu.style.display = PAUSED ? 'flex' : 'none';
    }
}

function resume() {
    PAUSED = false;
    var menu = document.getElementById('menu');
    if (menu) {
        menu.style.display = 'none';
    }
}

function help() {
    showMsg('WASD/Strzałki - poruszanie, Spacja - zbieranie, ESC - menu, 1-9 - wybierz narzędzie', 5000);
}

function showMsg(text, duration) {
    var msg = document.getElementById('msg');
    if (msg) {
        msg.textContent = text;
        msg.style.display = 'block';
        if (!duration) duration = 2000;
        setTimeout(function() {
            if (msg) msg.style.display = 'none';
        }, duration);
    }
}

// ==================== PĘTLA GRY ====================
var lastTime = 0;
function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    var deltaTime = timestamp - lastTime;
    lastTime = timestamp;
    
    update(deltaTime);
    render();
    
    GLOOP = requestAnimationFrame(gameLoop);
}

// ==================== ROZPOCZĘCIE ====================
window.onload = init;
window.onbeforeunload = function() {
    if (GLOOP) {
        cancelAnimationFrame(GLOOP);
    }
};
</script>
</body>
</html>
